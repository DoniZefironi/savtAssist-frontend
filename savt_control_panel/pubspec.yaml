name: control_panel
description: Приложение с авторизацией, ИИ-чатом, базой знаний и сканером QR

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.0.0
  provider: ^6.1.1
  mobile_scanner: ^4.0.1
  icons_plus: ^5.0.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0

  cross_file: ^0.3.3
  image_picker: ^1.0.7
  open_file: ^3.3.2
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  audioplayers: ^6.0.0   # для воспроизведения аудио (если нужно)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true